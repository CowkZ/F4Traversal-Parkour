name: Build F4Traversal Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://xmake.io/install.ps1" -OutFile "install.ps1"
          powershell -ExecutionPolicy Bypass -File "install.ps1"
          echo "$HOME\.xmake\bin" >> $GITHUB_PATH

      - name: Configure and Build
        run: |
          xmake f -m release
          xmake -v

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: F4Traversal-Plugin
          path: F4SE/Plugins/F4Traversal.dll
